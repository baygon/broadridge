<div class="package-list">
  <div class="status" *ngIf="loading()">Loading</div>
  <div class="status error" *ngIf="error()">{{ error() }}</div>
  <ng-container *ngIf="!loading() && !error()">
    <app-package-card
      *ngFor="let pkg of packages()"
      [package]="pkg"
      [isHovered]="hoveredId() === pkg.id"
      [isDependency]="hoveredDependencyIds().includes(pkg.id)"
      (mouseenter)="onCardEnter(pkg)"
      (mouseleave)="onCardLeave()"
    ></app-package-card>
  </ng-container>
</div>
